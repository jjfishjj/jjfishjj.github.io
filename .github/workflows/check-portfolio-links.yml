name: Check portfolio links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1'
  push:
    paths:
      - public/portfolio-manifest.json
      - scripts/check-portfolio-links.mjs
      - .github/workflows/check-portfolio-links.yml

permissions:
  contents: write

concurrency:
  group: portfolio-link-health
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:portfolio
      - name: Check public links and record history
        id: link-check
        continue-on-error: true
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/check-portfolio-links.mjs --concurrency 5 --retries 2 --timeout 15000 --history-file public/portfolio-health/history.json --run-url "$RUN_URL"
      - name: Commit health history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/portfolio-health/history.json
          git diff --cached --quiet || git commit -m "Update portfolio health history"
          git push origin HEAD:main
      - name: Fail when links are unhealthy
        if: steps.link-check.outcome == 'failure'
        run: exit 1
